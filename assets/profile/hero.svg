<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Robotics Engineer Portfolio</title>
  <desc id="desc">A dark technical visualization connecting perception, autonomy and embedded systems</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0a1b2e"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#148cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#148cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4296d2" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>
  <ellipse cx="600" cy="140" rx="390" ry="190" fill="url(#glow)"/>
  <path d="M0 224C145 195 218 239 350 207S572 144 712 178s251 71 488 12" fill="none" stroke="#22d3a6" stroke-opacity=".24" stroke-width="1.4"/>
  <path d="M0 232C145 203 218 247 350 215S572 152 712 186s251 71 488 12" fill="none" stroke="#1688e8" stroke-opacity=".34" stroke-width="1"/>

  <!-- LiDAR field -->
  <g transform="translate(150 140)" fill="none">
    <circle r="20" stroke="#58b7ff" stroke-width="1.5"/>
    <circle r="48" stroke="#58b7ff" stroke-opacity=".48"/>
    <circle r="78" stroke="#58b7ff" stroke-opacity=".22"/>
    <path d="M-92 0H92M0-92V92" stroke="#58b7ff" stroke-opacity=".18"/>
    <path d="M0 0L68-45M0 0L-56-61M0 0L81 26M0 0L-76 43" stroke="#25d5ac" stroke-opacity=".62"/>
    <g fill="#25d5ac">
      <circle cx="68" cy="-45" r="3"/><circle cx="-56" cy="-61" r="3"/>
      <circle cx="81" cy="26" r="3"/><circle cx="-76" cy="43" r="3"/>
    </g>
  </g>

  <!-- System core -->
  <g transform="translate(600 140)">
    <circle r="88" fill="#0b2138" stroke="#1a75b8" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#2b9bea" stroke-opacity=".35" stroke-dasharray="3 7"/>
    <path d="M-34-10L0-31l34 21v40L0 51l-34-21z" fill="#0d2d4a" stroke="#56baff" stroke-width="1.5"/>
    <circle r="9" fill="#22d3a6"/>
    <path d="M0-31V-57M34-10l23-14M34 30l23 14M0 51v26M-34 30l-23 14M-34-10l-23-14" stroke="#56baff" stroke-width="1.5"/>
    <g fill="#56baff">
      <circle cy="-60" r="3"/><circle cx="60" cy="-26" r="3"/><circle cx="60" cy="46" r="3"/>
      <circle cy="80" r="3"/><circle cx="-60" cy="46" r="3"/><circle cx="-60" cy="-26" r="3"/>
    </g>
  </g>

  <!-- UAV and controller -->
  <g transform="translate(1010 112)" stroke="#65bfff" fill="none" stroke-width="2">
    <path d="M-42 0H42M-24 0l-25-26M24 0l25-26M-24 0l-25 26M24 0l25 26"/>
    <circle r="12" fill="#0c2943"/><circle cx="-53" cy="-30" r="13"/><circle cx="53" cy="-30" r="13"/>
    <circle cx="-53" cy="30" r="13"/><circle cx="53" cy="30" r="13"/>
    <path d="M0 12v25l17 13H-17L0 37" stroke="#25d5ac"/>
  </g>
  <g transform="translate(1000 220)">
    <rect x="-58" y="-21" width="116" height="42" rx="5" fill="#0b243b" stroke="#298dd0"/>
    <rect x="-28" y="-10" width="56" height="20" rx="3" fill="#0f3856" stroke="#25d5ac"/>
    <g fill="#58b7ff"><circle cx="-43" r="3"/><circle cx="43" r="3"/></g>
    <g stroke="#298dd0"><path d="M-48-21v-11M-32-21v-11M32-21v-11M48-21v-11M-48 21v11M-32 21v11M32 21v11M48 21v11"/></g>
  </g>

  <!-- Connectivity -->
  <g fill="none" stroke="#258bd0" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="4 6">
    <path d="M242 140H500"/><path d="M700 140h224"/><path d="M1010 166v31"/>
  </g>
  <g fill="#25d5ac">
    <circle cx="341" cy="140" r="3"/><circle cx="456" cy="140" r="3"/>
    <circle cx="762" cy="140" r="3"/><circle cx="873" cy="140" r="3"/>
  </g>

  <text x="30" y="36" fill="#77a7c8" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">ROBOTIC SYSTEMS / 01</text>
  <text x="1170" y="36" text-anchor="end" fill="#22d3a6" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">PERCEPTION · AUTONOMY · CONTROL</text>
  <rect x=".5" y=".5" width="1199" height="279" rx="13.5" fill="none" stroke="#267bb5" stroke-opacity=".42"/>
</svg>
